<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon badge -->
  <rect width="60" height="60" rx="14" fill="#f97316"/>

  <!-- Vertical road -->
  <rect x="27" y="5" width="6" height="50" rx="2" fill="white" fill-opacity="0.15"/>

  <!-- Horizontal road -->
  <rect x="5" y="27" width="50" height="6" rx="2" fill="white" fill-opacity="0.15"/>

  <!-- Intersection glow -->
  <rect x="27" y="27" width="6" height="6" fill="white" fill-opacity="0.25"/>

  <!-- Vehicle nodes -->
  <circle cx="15"  cy="30" r="4"   fill="white"/>
  <circle cx="45"  cy="30" r="4"   fill="white" fill-opacity="0.65"/>
  <circle cx="30"  cy="15" r="4"   fill="white"/>
  <circle cx="30"  cy="45" r="4"   fill="white" fill-opacity="0.65"/>

  <!-- Central AI hub -->
  <circle cx="30" cy="30" r="6"   fill="white"/>
  <circle cx="30" cy="30" r="2.6" fill="#f97316"/>

  <!-- Wordmark -->
  <text
    x="76"
    y="22"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="22"
    font-weight="900"
    letter-spacing="-0.04em"
    fill="white"
  >Traffic<tspan fill="#f97316">AI</tspan></text>

  <text
    x="77"
    y="40"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="10"
    font-weight="700"
    letter-spacing="0.18em"
    fill="white"
    fill-opacity="0.35"
  >URBAN SIMULATION</text>
</svg>
